<svg viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="vpcGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="subnetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gkeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3E5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E1BEE7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="20" markerHeight="20" refX="18" refY="6" orient="auto">
      <polygon points="0 0, 20 6, 0 12" fill="#666" />
    </marker>
    <marker id="arrowhead2" markerWidth="20" markerHeight="20" refX="18" refY="6" orient="auto">
      <polygon points="0 0, 20 6, 0 12" fill="#4CAF50" />
    </marker>
    <marker id="arrowhead3" markerWidth="20" markerHeight="20" refX="18" refY="6" orient="auto">
      <polygon points="0 0, 20 6, 0 12" fill="#1976D2" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="2400" height="1600" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="1200" y="70" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#1a73e8" text-anchor="middle">
    GCP Infrastructure Architecture
  </text>
  
  <!-- Internet/External Users -->
  <ellipse cx="1200" cy="180" rx="320" ry="70" fill="#FFA726" stroke="#F57C00" stroke-width="4" filter="url(#shadow)"/>
  <text x="1200" y="195" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">
    Internet / External Users
  </text>
  
  <!-- Arrow to Load Balancer -->
  <line x1="1200" y1="250" x2="1200" y2="310" stroke="#666" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- Load Balancer -->
  <rect x="1000" y="310" width="400" height="100" rx="10" fill="#4CAF50" stroke="#2E7D32" stroke-width="4" filter="url(#shadow)"/>
  <text x="1200" y="375" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">
    Cloud Load Balancer (Ingress)
  </text>
  
  <!-- Arrow to VPC -->
  <line x1="1200" y1="410" x2="1200" y2="480" stroke="#666" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- VPC Container -->
  <rect x="100" y="480" width="2200" height="1040" rx="20" fill="url(#vpcGradient)" stroke="#4CAF50" stroke-width="6" filter="url(#shadow)"/>
  <text x="140" y="540" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#2E7D32">
    VPC: custom-vpc
  </text>
  
  <!-- Management Subnet -->
  <rect x="160" y="590" width="1000" height="420" rx="15" fill="url(#subnetGradient)" stroke="#1976D2" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="645" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1565C0">
    Management Subnet (10.0.1.0/24)
  </text>
  
  <!-- Management VM -->
  <rect x="220" y="690" width="380" height="280" rx="10" fill="white" stroke="#1976D2" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="410" cy="775" r="45" fill="#5E97F6"/>
  <text x="410" y="790" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">VM</text>
  <text x="410" y="850" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">
    Management VM
  </text>
  <text x="410" y="885" font-family="Arial, sans-serif" font-size="22" fill="#666" text-anchor="middle">
    • Private IP only
  </text>
  <text x="410" y="915" font-family="Arial, sans-serif" font-size="22" fill="#666" text-anchor="middle">
    • IAP tunnel access
  </text>
  <text x="410" y="945" font-family="Arial, sans-serif" font-size="22" fill="#666" text-anchor="middle">
    • kubectl configured
  </text>
  
  <!-- Cloud NAT -->
  <rect x="700" y="690" width="400" height="220" rx="10" fill="white" stroke="#FF9800" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="900" cy="770" r="45" fill="#FF9800"/>
  <text x="900" y="785" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">NAT</text>
  <text x="900" y="845" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#333" text-anchor="middle">
    Cloud NAT Gateway
  </text>
  <text x="900" y="880" font-family="Arial, sans-serif" font-size="20" fill="#666" text-anchor="middle">
    Outbound internet access
  </text>
  
  <!-- Arrow Management VM to NAT -->
  <line x1="600" y1="800" x2="700" y2="800" stroke="#666" stroke-width="4" stroke-dasharray="10,10" marker-end="url(#arrowhead)"/>
  
  <!-- Restricted Subnet -->
  <rect x="160" y="1050" width="2100" height="440" rx="15" fill="url(#subnetGradient)" stroke="#1976D2" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="1105" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1565C0">
    Restricted Subnet (10.0.2.0/24) - Private GKE Cluster
  </text>
  
  <!-- GKE Cluster Container -->
  <rect x="220" y="1150" width="2000" height="310" rx="10" fill="url(#gkeGradient)" stroke="#7B1FA2" stroke-width="4"/>
  
  <!-- Worker Node 1 -->
  <g>
    <rect x="280" y="1200" width="400" height="230" rx="10" fill="white" stroke="#7B1FA2" stroke-width="4" filter="url(#shadow)"/>
    <text x="480" y="1235" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">
      Worker Node 1
    </text>
    <!-- App Pod -->
    <rect x="320" y="1260" width="140" height="75" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="390" y="1305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      App Pod
    </text>
    <!-- Redis Pod -->
    <rect x="500" y="1260" width="140" height="75" rx="5" fill="#F44336" stroke="#C62828" stroke-width="2"/>
    <text x="570" y="1305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      Redis Pod
    </text>
    <!-- System info -->
    <text x="480" y="1370" font-family="Arial, sans-serif" font-size="16" fill="#666" text-anchor="middle">
      e2-medium
    </text>
    <text x="480" y="1395" font-family="Arial, sans-serif" font-size="16" fill="#666" text-anchor="middle">
      Private IP
    </text>
  </g>
  
  <!-- Worker Node 2 -->
  <g>
    <rect x="740" y="1200" width="400" height="230" rx="10" fill="white" stroke="#7B1FA2" stroke-width="4" filter="url(#shadow)"/>
    <text x="940" y="1235" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">
      Worker Node 2
    </text>
    <!-- App Pod -->
    <rect x="780" y="1260" width="140" height="75" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="850" y="1305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      App Pod
    </text>
    <!-- Redis Pod -->
    <rect x="960" y="1260" width="140" height="75" rx="5" fill="#F44336" stroke="#C62828" stroke-width="2"/>
    <text x="1030" y="1305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      Redis Pod
    </text>
    <!-- System info -->
    <text x="940" y="1370" font-family="Arial, sans-serif" font-size="16" fill="#666" text-anchor="middle">
      e2-medium
    </text>
    <text x="940" y="1395" font-family="Arial, sans-serif" font-size="16" fill="#666" text-anchor="middle">
      Private IP
    </text>
  </g>
  
  <!-- Worker Node N -->
  <g>
    <rect x="1200" y="1200" width="400" height="230" rx="10" fill="white" stroke="#7B1FA2" stroke-width="4" filter="url(#shadow)"/>
    <text x="1400" y="1235" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">
      Worker Node N
    </text>
    <text x="1400" y="1330" font-family="Arial, sans-serif" font-size="64" fill="#999" text-anchor="middle">
      ...
    </text>
  </g>
  
  <!-- GKE Features Box -->
  <rect x="1650" y="1200" width="520" height="230" rx="10" fill="white" stroke="#7B1FA2" stroke-width="3" filter="url(#shadow)"/>
  <text x="1910" y="1235" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#7B1FA2" text-anchor="middle">
    GKE Features
  </text>
  <text x="1690" y="1280" font-family="Arial, sans-serif" font-size="20" fill="#333">
    ✓ Private endpoint only
  </text>
  <text x="1690" y="1315" font-family="Arial, sans-serif" font-size="20" fill="#333">
    ✓ No public IPs on nodes
  </text>
  <text x="1690" y="1350" font-family="Arial, sans-serif" font-size="20" fill="#333">
    ✓ Authorized networks configured
  </text>
  <text x="1690" y="1385" font-family="Arial, sans-serif" font-size="20" fill="#333">
    ✓ Auto-scaling enabled
  </text>
  
  <!-- Firewall Rules Box -->
  <rect x="1240" y="590" width="1000" height="210" rx="10" fill="white" stroke="#E53935" stroke-width="4" filter="url(#shadow)"/>
  <text x="1740" y="645" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#C62828" text-anchor="middle">
    🔥 Firewall Rules
  </text>
  <text x="1300" y="695" font-family="Arial, sans-serif" font-size="24" fill="#333">
    • Allow SSH via IAP (tcp:22 from 35.235.240.0/20)
  </text>
  <text x="1300" y="735" font-family="Arial, sans-serif" font-size="24" fill="#333">
    • Allow internal communication between subnets
  </text>
  <text x="1300" y="775" font-family="Arial, sans-serif" font-size="24" fill="#333">
    • Allow GKE control plane to worker nodes
  </text>
  
  <!-- Artifact Registry -->
  <rect x="1240" y="840" width="1000" height="180" rx="10" fill="white" stroke="#9C27B0" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="1450" cy="930" r="55" fill="#9C27B0"/>
  <text x="1450" y="945" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AR</text>
  <text x="1740" y="910" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#7B1FA2" text-anchor="middle">
    Artifact Registry
  </text>
  <text x="1740" y="950" font-family="Arial, sans-serif" font-size="22" fill="#666" text-anchor="middle">
    Private container images storage
  </text>
  <text x="1740" y="985" font-family="Arial, sans-serif" font-size="22" fill="#666" text-anchor="middle">
    Vulnerability scanning enabled
  </text>
  
  <!-- Arrow from Load Balancer to GKE -->
  <path d="M 1200 410 Q 1200 750 600 1050" stroke="#4CAF50" stroke-width="4" fill="none" stroke-dasharray="10,10" marker-end="url(#arrowhead2)"/>
  
  <!-- Arrow from Management VM to GKE -->
  <path d="M 410 970 L 410 1150" stroke="#1976D2" stroke-width="4" stroke-dasharray="10,10" marker-end="url(#arrowhead3)"/>
  <text x="450" y="1060" font-family="Arial, sans-serif" font-size="20" fill="#1976D2">
    kubectl
  </text>
  
  <!-- Legend -->
  <g transform="translate(100, 1540)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">
      Legend:
    </text>
    <rect x="120" y="-22" width="35" height="35" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="170" y="5" font-family="Arial, sans-serif" font-size="24" fill="#333">Public/External Resource</text>
    
    <rect x="460" y="-22" width="35" height="35" rx="5" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
    <text x="510" y="5" font-family="Arial, sans-serif" font-size="24" fill="#333">Private Resource</text>
    
    <rect x="750" y="-22" width="35" height="35" rx="5" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
    <text x="800" y="5" font-family="Arial, sans-serif" font-size="24" fill="#333">Storage/Registry</text>
    
    <line x1="1060" y1="0" x2="1120" y2="0" stroke="#666" stroke-width="4" stroke-dasharray="10,10"/>
    <text x="1135" y="5" font-family="Arial, sans-serif" font-size="24" fill="#333">Network Connection</text>
  </g>
  
  <!-- Security Badge -->
  <rect x="1900" y="1540" width="380" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="3"/>
  <text x="2090" y="1575" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    🔒 Zero Trust Architecture
  </text>
</svg>