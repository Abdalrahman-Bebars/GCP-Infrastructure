<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vpcGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="subnetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gkeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3E5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E1BEE7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a73e8" text-anchor="middle">
    GCP Infrastructure Architecture
  </text>
  
  <!-- Internet/External Users -->
  <ellipse cx="600" cy="80" rx="150" ry="30" fill="#FFA726" stroke="#F57C00" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="88" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
    Internet / External Users
  </text>
  
  <!-- Arrow to Load Balancer -->
  <line x1="600" y1="110" x2="600" y2="140" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Load Balancer -->
  <rect x="500" y="140" width="200" height="50" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
    Cloud Load Balancer
  </text>
  
  <!-- Arrow to VPC -->
  <line x1="600" y1="190" x2="600" y2="220" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- VPC Container -->
  <rect x="50" y="220" width="1100" height="530" rx="10" fill="url(#vpcGradient)" stroke="#4CAF50" stroke-width="3" filter="url(#shadow)"/>
  <text x="70" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">
    VPC: custom-vpc
  </text>
  
  <!-- Management Subnet -->
  <rect x="80" y="270" width="500" height="220" rx="8" fill="url(#subnetGradient)" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">
    Management Subnet (10.0.1.0/24)
  </text>
  
  <!-- Management VM -->
  <rect x="110" y="320" width="180" height="130" rx="5" fill="white" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="200" cy="355" r="20" fill="#5E97F6"/>
  <text x="200" y="361" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">VM</text>
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">
    Management VM
  </text>
  <text x="200" y="408" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">
    Private IP only
  </text>
  <text x="200" y="423" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">
    IAP tunnel access
  </text>
  <text x="200" y="438" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">
    kubectl configured
  </text>
  
  <!-- Cloud NAT -->
  <rect x="350" y="320" width="190" height="100" rx="5" fill="white" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="445" cy="355" r="20" fill="#FF9800"/>
  <text x="445" y="361" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">NAT</text>
  <text x="445" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">
    Cloud NAT Gateway
  </text>
  <text x="445" y="405" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">
    Outbound internet
  </text>
  
  <!-- Arrow Management VM to NAT -->
  <line x1="290" y1="370" x2="350" y2="370" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Restricted Subnet -->
  <rect x="80" y="510" width="1050" height="220" rx="8" fill="url(#subnetGradient)" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">
    Restricted Subnet (10.0.2.0/24) - Private GKE Cluster
  </text>
  
  <!-- GKE Cluster Container -->
  <rect x="110" y="555" width="1000" height="155" rx="5" fill="url(#gkeGradient)" stroke="#7B1FA2" stroke-width="2"/>
  
  <!-- Worker Node 1 -->
  <g>
    <rect x="140" y="580" width="200" height="110" rx="5" fill="white" stroke="#7B1FA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="240" y="600" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">
      Worker Node 1
    </text>
    <!-- App Pod -->
    <rect x="160" y="610" width="70" height="35" rx="3" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
    <text x="195" y="632" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">
      App Pod
    </text>
    <!-- Redis Pod -->
    <rect x="250" y="610" width="70" height="35" rx="3" fill="#F44336" stroke="#C62828" stroke-width="1"/>
    <text x="285" y="632" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">
      Redis Pod
    </text>
  </g>
  
  <!-- Worker Node 2 -->
  <g>
    <rect x="370" y="580" width="200" height="110" rx="5" fill="white" stroke="#7B1FA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="600" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">
      Worker Node 2
    </text>
    <!-- App Pod -->
    <rect x="390" y="610" width="70" height="35" rx="3" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
    <text x="425" y="632" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">
      App Pod
    </text>
    <!-- Redis Pod -->
    <rect x="480" y="610" width="70" height="35" rx="3" fill="#F44336" stroke="#C62828" stroke-width="1"/>
    <text x="515" y="632" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">
      Redis Pod
    </text>
  </g>
  
  <!-- Worker Node N -->
  <g>
    <rect x="600" y="580" width="200" height="110" rx="5" fill="white" stroke="#7B1FA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="600" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">
      Worker Node N
    </text>
    <text x="700" y="635" font-family="Arial, sans-serif" font-size="24" fill="#999" text-anchor="middle">
      ...
    </text>
  </g>
  
  <!-- GKE Features -->
  <text x="850" y="600" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ Private endpoint only
  </text>
  <text x="850" y="620" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ No public IPs on nodes
  </text>
  <text x="850" y="640" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ Authorized networks
  </text>
  <text x="850" y="660" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ Auto-scaling enabled
  </text>
  
  <!-- Firewall Rules Box -->
  <rect x="620" y="270" width="490" height="100" rx="5" fill="white" stroke="#E53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="865" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828" text-anchor="middle">
    Firewall Rules
  </text>
  <text x="650" y="318" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Allow SSH via IAP
  </text>
  <text x="650" y="336" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Allow internal communication between subnets
  </text>
  <text x="650" y="354" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Allow GKE control plane to worker nodes
  </text>
  
  <!-- Artifact Registry -->
  <rect x="620" y="390" width="490" height="90" rx="5" fill="white" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="750" cy="435" r="25" fill="#9C27B0"/>
  <text x="750" y="443" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">AR</text>
  <text x="865" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2" text-anchor="middle">
    Artifact Registry
  </text>
  <text x="865" y="448" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
    Private container images
  </text>
  <text x="865" y="465" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
    Secure image storage
  </text>
  
  <!-- Arrow from Load Balancer to GKE -->
  <path d="M 600 190 Q 600 350 300 550" stroke="#4CAF50" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead2)"/>
  
  <!-- Arrow from Management VM to GKE -->
  <path d="M 200 450 L 200 555" stroke="#1976D2" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead3)"/>
  
  <!-- Legend -->
  <g transform="translate(50, 760)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      Legend:
    </text>
    <rect x="60" y="-10" width="15" height="15" fill="#4CAF50"/>
    <text x="80" y="0" font-family="Arial, sans-serif" font-size="10" fill="#333">Public Resource</text>
    
    <rect x="180" y="-10" width="15" height="15" fill="#1976D2"/>
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="10" fill="#333">Private Resource</text>
    
    <line x1="310" y1="-5" x2="340" y2="-5" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="350" y="0" font-family="Arial, sans-serif" font-size="10" fill="#333">Network Connection</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4CAF50" />
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976D2" />
    </marker>
  </defs>
</svg>